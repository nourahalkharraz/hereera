<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Tajawal:wght@200;300;400;500&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap">
  <style>
    body { margin: 0; }
    a { color: #666848; } a:hover { color: #4D5033; }
  </style>
</helmet>
<div dir="rtl" style="width: 390px; height: 460px; background: #FAF6ED; font-family: 'Tajawal', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 18px; box-sizing: border-box">
  <div style="font-size: 11px; letter-spacing: .08em; color: #B1B388; font-weight: 400; margin-bottom: 26px">ب · لقبٌ تحت كلّ اسم</div>
  <div style="font-family: 'Reem Kufi', system-ui, sans-serif; font-weight: 700; color: #666848; font-size: 22.6px; line-height: 1.35">حفل عقد قران</div>
  <div style="margin-top: 19px; display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: start; column-gap: .10em; width: max-content; max-width: 100%">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <b style="font-family: 'Reem Kufi', system-ui, sans-serif; font-weight: 700; font-size: 52px; line-height: 1.08; color: transparent; background-image: linear-gradient(200deg, #4D5033 0%, #4D5033 26%, #666848 72%, #666848 100%); -webkit-background-clip: text; background-clip: text">سند</b>
      <span style="font-size: 12.5px; color: #6E5E53; line-height: 1.6">عبدالله الفايز</span>
    </div>
    <i style="font-style: normal; color: #818263; font-size: 34px; font-weight: 200; font-family: 'Tajawal', system-ui, sans-serif; margin: 0 .16em; line-height: 1.7">|</i>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <b style="font-family: 'Reem Kufi', system-ui, sans-serif; font-weight: 700; font-size: 52px; line-height: 1.08; color: transparent; background-image: linear-gradient(200deg, #4D5033 0%, #4D5033 26%, #666848 72%, #666848 100%); -webkit-background-clip: text; background-clip: text">نورة</b>
      <span style="font-size: 12.5px; color: #6E5E53; line-height: 1.6">عبدالوهاب الخرّاز</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
