<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مُرتِّب — نظّم شغلك وأفكارك</title>
<meta name="description" content="مساحة واحدة تكتب فيها كل شي يجيك على بالك، وهي ترتبه لك تلقائيًا: المهم، العاجل، الأفكار، والمؤجَّل.">
<meta name="theme-color" content="#FBEDDA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marhey:wght@500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<style>
/* ============================== TOKENS — retro feminine ==============================
   لوحة سبعينية: كريمي، ورد قديم، خردلي، ونعناعي — بحدود سميكة وظلال صلبة زي الستيكرات
   ==================================================================================== */
:root{
  --rose:#D2496B; --rose-deep:#9B2F4E; --rose-soft:#FADCE2;
  --mustard:#C98716; --mustard-soft:#FBEBC8;
  --teal:#2F7E7E;   --teal-soft:#D9EDE9;
  --sage:#6E8A62;   --sage-soft:#E4EBDC;
  --violet:#8A5AA8; --violet-soft:#EFE0F5;
  --terra:#DC7A45;

  --accent:var(--rose); --accent-soft:var(--rose-soft); --accent-deep:var(--rose-deep);
  --bg:#FBEDDA; --surface:#FFF9F0; --surface-2:#FDF2E4;
  --ink:#43213A; --ink2:#7C5468; --ink3:#A98B93;
  --line:#43213A; --line-2:#43213A;          /* الحدود دايمًا حبر — هذا سر الشكل الريترو */
  --dots:rgba(67,33,58,.07);
  --hard:#43213A;                             /* لون الظل الصلب */
  --radius:20px; --radius-sm:14px;
  --shadow:-3px 3px 0 var(--hard);
  --shadow-lg:-6px 6px 0 var(--hard);

  --fire:var(--rose);   --fire-bg:var(--rose-soft);
  --star:var(--mustard);--star-bg:var(--mustard-soft);
  --bolt:var(--teal);   --bolt-bg:var(--teal-soft);
  --sleep:var(--sage);  --sleep-bg:var(--sage-soft);
  --idea:var(--violet); --idea-bg:var(--violet-soft);
  --ok:#4E8C5B; --ok-bg:#E1EFE1;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --rose:#FF8FAE; --rose-deep:#FFC2D2; --rose-soft:#4A2233;
    --mustard:#EFC059; --mustard-soft:#42341A;
    --teal:#7FCFC7;   --teal-soft:#173A38;
    --sage:#A9C79A;   --sage-soft:#22331F;
    --violet:#CDA3E4; --violet-soft:#33203D;
    --accent:var(--rose); --accent-soft:var(--rose-soft); --accent-deep:var(--rose-deep);
    --bg:#241423; --surface:#311D2E; --surface-2:#3A2337;
    --ink:#FBEDDA; --ink2:#C9A9B8; --ink3:#977D8B;
    --line:#5E3A54; --line-2:#7A4E6B;
    --dots:rgba(251,237,218,.05);
    --hard:#150B14;
    --ok:#8ED6A0; --ok-bg:#1B3323;
  }
}
:root[data-theme="dark"]{
  --rose:#FF8FAE; --rose-deep:#FFC2D2; --rose-soft:#4A2233;
  --mustard:#EFC059; --mustard-soft:#42341A;
  --teal:#7FCFC7;   --teal-soft:#173A38;
  --sage:#A9C79A;   --sage-soft:#22331F;
  --violet:#CDA3E4; --violet-soft:#33203D;
  --accent:var(--rose); --accent-soft:var(--rose-soft); --accent-deep:var(--rose-deep);
  --bg:#241423; --surface:#311D2E; --surface-2:#3A2337;
  --ink:#FBEDDA; --ink2:#C9A9B8; --ink3:#977D8B;
  --line:#5E3A54; --line-2:#7A4E6B;
  --dots:rgba(251,237,218,.05);
  --hard:#150B14;
  --ok:#8ED6A0; --ok-bg:#1B3323;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Tajawal',system-ui,-apple-system,sans-serif;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dots) 1.4px, transparent 1.4px);
  background-size:16px 16px;
  color:var(--ink); min-height:100vh; line-height:1.6; font-size:15px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.logo,.timer,.col-title,.focus-task,.empty-page h3,.modal-box h3{
  font-family:'Marhey','Tajawal',sans-serif;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::selection{background:var(--accent);color:var(--bg)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================== LAYOUT ============================== */
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 120px}
@media (max-width:600px){.wrap{padding:0 12px 130px}}

/* ============================== HEADER ============================== */
header{
  position:sticky;top:0;z-index:60;
  background:var(--bg);
  border-bottom:3px solid var(--ink);
}
/* شريط مخطط ريترو تحت الهيدر */
header::after{
  content:'';position:absolute;inset-inline:0;bottom:-9px;height:6px;
  background:repeating-linear-gradient(90deg,
    var(--rose) 0 26px, var(--terra) 26px 52px, var(--mustard) 52px 78px,
    var(--sage) 78px 104px, var(--teal) 104px 130px);
  opacity:.85;
}
.hdr{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{
  font-size:23px;font-weight:700;letter-spacing:0;display:flex;align-items:center;gap:8px;
  margin-inline-end:auto;color:var(--ink);
}
.logo span{color:var(--rose)}
.hdr-stats{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:999px;background:var(--surface);
  border:2px solid var(--ink);font-size:12.5px;font-weight:700;color:var(--ink2);
  white-space:nowrap;
}
.chip b{color:var(--ink);font-weight:900}
.chip.hot{background:var(--rose-soft);color:var(--rose-deep)}
.icon-btn{
  width:38px;height:38px;border-radius:50%;background:var(--surface);
  border:2px solid var(--ink);display:grid;place-items:center;font-size:16px;
  box-shadow:-2px 2px 0 var(--hard);
  transition:transform .12s, box-shadow .12s, background .15s;
}
.icon-btn:hover{background:var(--mustard-soft);transform:translate(1px,-1px);box-shadow:-3px 3px 0 var(--hard)}
.icon-btn:active{transform:translate(-2px,2px);box-shadow:0 0 0 var(--hard)}

/* ============================== CAPTURE ============================== */
.capture{
  position:relative;
  background:var(--surface);border:3px solid var(--ink);
  border-radius:var(--radius);box-shadow:var(--shadow-lg);
  padding:16px;margin:30px 0 16px;
  transition:box-shadow .18s, transform .18s;
}
.capture:focus-within{transform:translate(2px,-2px);box-shadow:-9px 9px 0 var(--hard)}
/* لِسان ستيكر فوق صندوق الكتابة */
.capture::before{
  content:'اكتبي هنا ✿';
  position:absolute;top:-15px;inset-inline-start:22px;
  background:var(--rose);color:#FFF9F0;
  font-family:'Marhey','Tajawal',sans-serif;font-size:12.5px;font-weight:700;
  padding:2px 14px;border-radius:999px;border:2px solid var(--ink);
  box-shadow:-2px 2px 0 var(--hard);letter-spacing:.5px;
}
.capture-top{display:flex;align-items:flex-start;gap:10px}
.capture-icon{font-size:19px;padding-top:7px;flex-shrink:0}
#capture-input{
  flex:1;border:none;background:none;resize:none;
  font-size:16.5px;font-weight:500;line-height:1.65;
  min-height:34px;max-height:220px;padding:5px 0;
}
#capture-input::placeholder{color:var(--ink3);font-weight:500}
.capture-bottom{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:10px;padding-top:11px;
  border-top:2px dashed var(--line);
}
.hint{font-size:11.5px;color:var(--ink2);font-weight:500;margin-inline-end:auto;line-height:1.6}
.hint kbd{
  background:var(--mustard-soft);border:2px solid var(--ink);
  border-radius:6px;padding:0 6px;font-size:10.5px;font-family:inherit;font-weight:700;color:var(--ink);
}
.btn{
  padding:9px 20px;border-radius:999px;font-weight:700;font-size:14.5px;
  font-family:'Marhey','Tajawal',sans-serif;
  background:var(--rose);color:#FFF9F0;
  border:2px solid var(--ink);box-shadow:-3px 3px 0 var(--hard);
  transition:transform .12s, box-shadow .12s, background .15s;
}
.btn:hover{transform:translate(1px,-1px);box-shadow:-5px 5px 0 var(--hard)}
.btn:active{transform:translate(-3px,3px);box-shadow:0 0 0 var(--hard)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.ghost:hover{background:var(--mustard-soft)}
.btn.sm{padding:7px 15px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:-3px 3px 0 var(--hard)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .btn{color:#241423}
  :root:not([data-theme="light"]) .btn.ghost{color:var(--ink)}
}
:root[data-theme="dark"] .btn{color:#241423}
:root[data-theme="dark"] .btn.ghost{color:var(--ink)}

.preview{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);flex-wrap:wrap}
.preview:empty{display:none}

/* ============================== TABS ============================== */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:700;
  font-family:'Marhey','Tajawal',sans-serif;
  color:var(--ink);background:var(--surface);border:2px solid var(--ink);
  box-shadow:-2px 2px 0 var(--hard);white-space:nowrap;
  transition:background .15s, transform .12s, box-shadow .12s;
}
.tab:hover{transform:translate(1px,-1px);box-shadow:-3px 3px 0 var(--hard)}
.tab[aria-selected="true"]{background:var(--rose);color:#FFF9F0}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#241423}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#241423}}
.tab .n{font-size:11px;opacity:.75;margin-inline-start:4px;font-weight:700;font-variant-numeric:tabular-nums}

/* ============================== SEARCH ============================== */
.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search{
  flex:1;min-width:180px;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:2px solid var(--ink);
  border-radius:999px;padding:8px 16px;box-shadow:-2px 2px 0 var(--hard);
}
.search input{flex:1;border:none;background:none;font-size:14px;font-weight:500}
.search input::placeholder{color:var(--ink3)}
@media (max-width:560px){
  .search{flex:1 0 100%}
  .toolbar .btn{flex:1}
}

/* ============================== BOARD ============================== */
.board{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-items:start}
.col{
  background:var(--surface);border:3px solid var(--ink);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
}
.col-head{
  display:flex;align-items:center;gap:10px;padding:13px 16px;
  border-bottom:3px solid var(--ink);
}
.col-dot{
  width:14px;height:14px;flex-shrink:0;border:2px solid var(--ink);
  border-radius:50%;background:var(--surface);
}
.col-title{font-weight:700;font-size:15.5px;letter-spacing:0}
.col-sub{font-size:11px;color:var(--ink2);font-weight:600;display:block;font-family:'Tajawal',sans-serif}
.col-count{
  margin-inline-start:auto;font-size:12.5px;font-weight:900;color:var(--ink);
  background:var(--surface);border:2px solid var(--ink);
  border-radius:999px;min-width:28px;text-align:center;padding:1px 9px;
  font-variant-numeric:tabular-nums;
}
.col-body{padding:11px;display:flex;flex-direction:column;gap:10px;min-height:56px}
.col[data-cat="fire"]  .col-dot{background:var(--fire)}  .col[data-cat="fire"]  .col-head{background:var(--fire-bg)}
.col[data-cat="star"]  .col-dot{background:var(--star)}  .col[data-cat="star"]  .col-head{background:var(--star-bg)}
.col[data-cat="bolt"]  .col-dot{background:var(--bolt)}  .col[data-cat="bolt"]  .col-head{background:var(--bolt-bg)}
.col[data-cat="sleep"] .col-dot{background:var(--sleep)} .col[data-cat="sleep"] .col-head{background:var(--sleep-bg)}
.col[data-cat="idea"]  .col-dot{background:var(--idea)}  .col[data-cat="idea"]  .col-head{background:var(--idea-bg)}

/* ============================== CARD ============================== */
.card{
  background:var(--surface-2);border:2px solid var(--ink);
  border-radius:var(--radius-sm);padding:11px 12px;
  display:flex;gap:10px;align-items:flex-start;
  box-shadow:-2px 2px 0 var(--hard);
  transition:transform .12s, box-shadow .12s, opacity .2s;
  animation:pop .24s cubic-bezier(.2,.9,.3,1.35);
}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
.card:hover{transform:translate(1px,-1px);box-shadow:-4px 4px 0 var(--hard)}
.card.is-today{background:var(--rose-soft)}
.card.done{opacity:.55;box-shadow:none;transform:none}
.card.done .card-text{text-decoration:line-through;color:var(--ink3)}
.check{
  width:23px;height:23px;border-radius:50%;flex-shrink:0;margin-top:2px;
  border:2px solid var(--ink);background:var(--surface);
  display:grid;place-items:center;font-size:12px;color:transparent;
  transition:background .15s, color .15s, transform .12s;
}
.check:hover{background:var(--mustard);transform:scale(1.12)}
.card.done .check{background:var(--ok);color:var(--surface);border-color:var(--ink)}
.card-main{flex:1;min-width:0}
.card-text{font-size:14.5px;font-weight:600;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.card-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:7px}
.card-meta:empty{display:none}
.tag{
  font-size:10.5px;font-weight:700;padding:1px 9px;border-radius:999px;
  background:var(--violet-soft);color:var(--ink);border:1.5px solid var(--ink);
}
.tag.due{background:var(--surface)}
.tag.due.late{background:var(--rose);color:#FFF9F0}
.tag.due.soon{background:var(--mustard-soft)}
:root[data-theme="dark"] .tag.due.late{color:#241423}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.due.late{color:#241423}}
.tag.steps{background:var(--teal-soft);font-variant-numeric:tabular-nums}
.card-actions{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:opacity .15s}
.card:hover .card-actions,.card:focus-within .card-actions{opacity:1}
@media (hover:none){.card-actions{opacity:1}}
.mini{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;color:var(--ink2);border:2px solid transparent;
  transition:background .15s,border-color .15s;
}
.mini:hover{background:var(--surface);border-color:var(--ink);color:var(--ink)}
.mini.on{background:var(--mustard);border-color:var(--ink);color:var(--ink)}

/* steps */
.steps{margin-top:9px;display:flex;flex-direction:column;gap:5px;padding-inline-start:2px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);font-weight:600;text-align:start}
.step-box{
  width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);
  flex-shrink:0;display:grid;place-items:center;font-size:8px;color:transparent;background:var(--surface);
}
.step.done .step-box{background:var(--ok);color:var(--surface)}
.step.done span{text-decoration:line-through;color:var(--ink3)}
.step-add{font-size:12px;font-weight:700;color:var(--rose);padding:3px 0;text-align:start}
.step-input{
  width:100%;border:2px solid var(--ink);background:var(--surface);
  border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;
}

/* ============================== EMPTY ============================== */
.empty{text-align:center;padding:26px 14px;color:var(--ink3);font-size:13px;font-weight:600;line-height:1.7}
.empty .big{font-size:26px;display:block;margin-bottom:6px;opacity:.55}
.empty-page{
  background:var(--surface);border:3px dashed var(--ink);border-radius:var(--radius);
  padding:46px 22px;text-align:center;
}
.empty-page h3{font-size:21px;font-weight:700;margin-bottom:8px}
.empty-page p{color:var(--ink2);font-size:14px;max-width:400px;margin:0 auto;font-weight:500}

/* ============================== FOCUS ============================== */
.focus{
  position:fixed;inset:0;z-index:200;
  background:var(--bg);
  background-image:
    repeating-conic-gradient(from 0deg at 50% 22%,
      var(--dots) 0deg 6deg, transparent 6deg 12deg),
    radial-gradient(var(--dots) 1.4px, transparent 1.4px);
  background-size:auto, 16px 16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;gap:18px;overflow:auto;
}
.focus[hidden]{display:none}
.focus-label{
  font-size:12px;font-weight:700;letter-spacing:3px;color:var(--ink);
  background:var(--mustard-soft);border:2px solid var(--ink);border-radius:999px;
  padding:4px 16px;box-shadow:-2px 2px 0 var(--hard);
}
.focus-task{
  font-size:clamp(23px,5.5vw,40px);font-weight:700;line-height:1.45;
  max-width:660px;white-space:pre-wrap;
}
.timer{
  font-size:clamp(52px,13vw,88px);font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:1px;
  color:var(--rose);line-height:1;
  text-shadow:-4px 4px 0 var(--hard);
}
.timer.paused{color:var(--ink3)}
.focus-steps{
  display:flex;flex-direction:column;gap:8px;max-width:440px;width:100%;
  text-align:start;background:var(--surface);border:3px solid var(--ink);
  border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);
}
.focus-steps:empty{display:none}
.focus-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ring{
  width:100%;max-width:440px;height:14px;border-radius:999px;
  background:var(--surface);border:2px solid var(--ink);overflow:hidden;
  box-shadow:-2px 2px 0 var(--hard);
}
.ring i{
  display:block;height:100%;
  background:repeating-linear-gradient(45deg,
    var(--rose) 0 10px, var(--terra) 10px 20px);
  transition:width .5s linear;
}

/* ============================== MODAL ============================== */
.modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:18px;background:rgba(67,33,58,.55)}
.modal[hidden]{display:none}
.modal-box{
  background:var(--surface);border:3px solid var(--ink);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);width:100%;max-width:460px;padding:24px;
  max-height:86vh;overflow:auto;
}
.modal-box h3{font-size:21px;font-weight:700;margin-bottom:8px}
.modal-box p{font-size:13.5px;color:var(--ink2);margin-bottom:14px;font-weight:500;line-height:1.75}
.modal-box textarea{
  width:100%;min-height:130px;border:2px solid var(--ink);border-radius:14px;
  padding:12px;font-size:13px;background:var(--surface-2);resize:vertical;line-height:1.6;
}
.modal-actions{display:flex;gap:9px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}

/* ============================== TOAST ============================== */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{
  background:var(--surface);color:var(--ink);padding:9px 18px;border-radius:999px;
  font-size:13.5px;font-weight:700;
  border:2px solid var(--ink);box-shadow:-3px 3px 0 var(--hard);
  display:flex;align-items:center;gap:10px;pointer-events:auto;
  animation:up .25s cubic-bezier(.2,.9,.3,1.25);
}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.toast button{color:var(--rose-deep);font-weight:900;font-size:13px;text-decoration:underline}
:root[data-theme="dark"] .toast button{color:var(--rose)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast button{color:var(--rose)}}

/* ============================== BOTTOM BAR ============================== */
.dock{
  position:fixed;bottom:0;inset-inline:0;z-index:70;
  background:var(--bg);border-top:3px solid var(--ink);
  padding:11px 16px calc(11px + env(safe-area-inset-bottom));
}
.dock-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.progress{flex:1;min-width:120px}
.progress-bar{
  height:14px;border-radius:999px;background:var(--surface);

<body>

<main class="wrap">

  <!-- CAPTURE -->

    </div>

        <span id="hint-default"><kbd>Enter</kbd> للحفظ · <kbd>Shift+Enter</kbd> سطر جديد · تلصقين قائمة كاملة؟ كل سطر يصير مهمة</span>

    <textarea id="data-box" spellcheck="false" aria-label="بيانات JSON"></textarea>
    <div class="modal-actions">
      <button class="btn" id="btn-copy">📋 انسخي</button>
      <button class="btn ghost" id="btn-import">📥 استوردي</button>
      <button class="btn ghost" id="btn-close">إغلاق</button>
    </div>
  </div>

<div id="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ==================================================================
   STORAGE
   ================================================================== */
const KEY = 'murattib_v1';
const DEFAULT = { items:[], streak:{count:0,last:null}, focusMin:25, theme:null };
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(DEFAULT);
    const p = JSON.parse(raw);
    return Object.assign(structuredClone(DEFAULT), p);
  }catch(e){ return structuredClone(DEFAULT); }
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ toast('ما قدرت أحفظ — الذاكرة ممتلئة'); }
  }, 120);
}

/* ==================================================================
   DATES
   ================================================================== */
const DAY = 864e5;
const todayKey = () => new Date().toISOString().slice(0,10);
function keyFrom(d){ const x=new Date(d); x.setHours(12,0,0,0); return x.toISOString().slice(0,10); }
function daysLeft(key){
  if(!key) return null;
  const a = new Date(todayKey()+'T12:00:00'), b = new Date(key+'T12:00:00');
  return Math.round((b-a)/DAY);
}
function dueLabel(key){
  const d = daysLeft(key);
  if(d===null) return '';
  if(d < -1) return `متأخرة ${Math.abs(d)} أيام`;
  if(d === -1) return 'متأخرة من أمس';
  if(d === 0) return 'اليوم';
  if(d === 1) return 'بكرة';
  if(d === 2) return 'بعد بكرة';
  if(d <= 7) return `خلال ${d} أيام`;
  return new Date(key+'T12:00:00').toLocaleDateString('ar', {day:'numeric', month:'long'});
}

/* ==================================================================
   SMART PARSER — يقرأ اللي تكتبينه ويستخرج منه المعنى
   ================================================================== */
const WEEKDAYS = {
  'الأحد':0,'الاحد':0,'الإثنين':1,'الاثنين':1,'الثلاثاء':2,'الأربعاء':3,'الاربعاء':3,
  'الخميس':4,'الجمعة':5,'السبت':6
};
const W_URGENT = ['عاجل','مستعجل','ضروري','بسرعة','الحين','حالاً','حالا','لازم اليوم','deadline','asap','urgent','متأخر','ينتهي','قبل ما','فوت'];
const W_IMPORTANT = ['مهم','أساسي','اساسي','رئيسي','يفرق','مصيري','عميل','عميلة','زبون','فلوس','دفع','فاتورة','عقد','امتحان','مقابلة','تسليم','مشروع','شغل','important'];
const W_IDEA = ['فكرة','افكر','أفكر','ممكن','ياليت','احلم','أحلم','يمكن','إلهام','الهام','idea','maybe','someday','يوم من الأيام','بالمستقبل','نفسي'];
const W_SMALL = ['بسيط','صغير','سريع','دقيقة','دقايق','وقت فراغ','لو فضيت','لو فضيتي','مو مستعجل','مو مستعجلة','متى ما'];

/** حدود الكلمة العربية — \b ما تشتغل مع العربي في JS */
function word(hay, ...forms){
  return forms.some(f => new RegExp(`(^|[^\\p{L}\\p{N}])${f}($|[^\\p{L}\\p{N}])`,'u').test(hay));
}

function parse(raw){
  let text = raw.trim();
  const out = { tags:[], due:null, urgent:false, important:false, idea:false, small:false };

  // ! أو !! → عاجل ومهم   |   ؟ في الآخر → فكرة/تفكير
  const bangs = (text.match(/!/g)||[]).length;
  if(bangs >= 1){ out.urgent = true; out.important = true; }
  if(bangs >= 2){ /* تأكيد إضافي */ }
  if(/^\s*[?؟]/.test(text) || /[?؟]\s*$/.test(text)) out.idea = true;

  // #وسوم
  text = text.replace(/#([^\s#]+)/g, (m,t)=>{ if(out.tags.length<4) out.tags.push(t); return ''; });

  const low = ' ' + text.toLowerCase() + ' ';
  const has = list => list.some(w => low.includes(w.toLowerCase()));

  if(has(W_URGENT)) out.urgent = true;
  if(has(W_IMPORTANT)) out.important = true;
  if(has(W_IDEA)) out.idea = true;
  if(has(W_SMALL)) out.small = true;

  // تواريخ
  const now = new Date();
  const setDue = off => { const d=new Date(now); d.setDate(d.getDate()+off); out.due = keyFrom(d); };

  if(/بعد\s*بكرة|بعد\s*بكره|بعد\s*غد/.test(low)) setDue(2);
  else if(word(low,'اليوم','الحين','today')) setDue(0);
  else if(word(low,'بكرة','بكره','غدا','غداً','tomorrow')) setDue(1);
  else if(/(الأسبوع|الاسبوع)\s*(الجاي|القادم)/.test(low)) setDue(7);
  else {
    for(const [name, idx] of Object.entries(WEEKDAYS)){
      if(word(low, name)){
        let diff = (idx - now.getDay() + 7) % 7;
        if(diff === 0) diff = 7;
        setDue(diff);
        break;
      }
    }
  }
  // "خلال 3 أيام" / "بعد 5 ايام"
  const m = low.match(/(?:بعد|خلال)\s*(\d+)\s*(يوم|أيام|ايام)/);
  if(m) setDue(parseInt(m[1],10));

  // التاريخ يقرّب → عاجل، ومهم إلا إذا قلتِ إنه شي بسيط
  const dl = daysLeft(out.due);
  if(dl !== null && dl <= 1){ out.urgent = true; if(!out.small) out.important = true; }
  else if(dl !== null && dl <= 3) out.important = true;

  text = text.replace(/\s{2,}/g,' ').replace(/^[\s!]+|[\s!]+$/g,'').trim();
  return { text, ...out };
}

/** يحدد الخانة: fire / star / bolt / sleep / idea */
function classify(p){
  if(p.idea && !p.urgent && !p.due) return 'idea';
  if(p.important && p.urgent) return 'fire';
  if(p.small && !p.urgent) return 'sleep';
  if(p.important) return 'star';
  if(p.urgent) return 'bolt';
  return 'star'; // الافتراضي: مهم بس مو مستعجل — أأمن من إهمالها
}

const CATS = {
  fire : {t:'مهم وعاجل',        s:'سويّها الحين — لا تأجلينها', e:'🔥'},
  star : {t:'مهم بس مو مستعجل', s:'حطي لها وقت في يومك',        e:'⭐'},
  bolt : {t:'عاجل بس مو مهم',   s:'خلّصيها بسرعة أو فوّتيها',    e:'⚡'},
  sleep: {t:'لاحقًا',            s:'لو فضيتِ — بدون ضغط',        e:'💤'},
  idea : {t:'أفكار',             s:'مو مهام — بس محفوظة لك',     e:'💡'},
};
const ORDER = ['fire','star','bolt','sleep','idea'];

/* ==================================================================
   ITEMS
   ================================================================== */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function addItem(raw){
  const p = parse(raw);
  if(!p.text) return null;
  const it = {
    id: uid(), text: p.text, cat: classify(p), tags: p.tags, due: p.due,
    done:false, today:false, steps:[], createdAt: Date.now(), doneAt:null
  };
  S.items.unshift(it);
  return it;
}
const byId = id => S.items.find(i=>i.id===id);

function toggleDone(id){
  const it = byId(id); if(!it) return;
  it.done = !it.done;
  it.doneAt = it.done ? Date.now() : null;
  if(it.done){ it.today = false; bumpStreak(); }
  save(); render();
}

function bumpStreak(){
  const t = todayKey();
  if(S.streak.last === t) return;
  const y = keyFrom(Date.now() - DAY);
  S.streak.count = (S.streak.last === y) ? S.streak.count + 1 : 1;
  S.streak.last = t;
  if(S.streak.count > 1) toast(`🔥 ${S.streak.count} أيام على التوالي — استمري!`);
}

/* ==================================================================
   VIEWS
   ================================================================== */
let view = 'today';
let query = '';

function matches(it){
  if(!query) return true;
  const q = query.toLowerCase();
  return it.text.toLowerCase().includes(q)
      || it.tags.some(t=>t.toLowerCase().includes(q))
      || it.steps.some(s=>s.t.toLowerCase().includes(q));
}

function visibleItems(){
  let list = S.items.filter(matches);
  // البحث يدوّر في كل شي — ما يفرق أي تبويب فاتحة
  if(query) return list;
  if(view === 'done')  return list.filter(i=>i.done).sort((a,b)=>b.doneAt-a.doneAt);
  if(view === 'ideas') return list.filter(i=>!i.done && i.cat==='idea');
  list = list.filter(i=>!i.done);
  if(view === 'today') list = list.filter(i => i.today || i.cat==='fire' || (daysLeft(i.due)!==null && daysLeft(i.due)<=0));
  if(view === 'all')   list = list.filter(i => i.cat!=='idea');
  return list;
}

function sortItems(a,b){
  if(a.today !== b.today) return a.today ? -1 : 1;
  const da = daysLeft(a.due), db = daysLeft(b.due);
  if(da !== null && db !== null && da !== db) return da - db;
  if(da !== null && db === null) return -1;
  if(db !== null && da === null) return 1;
  return b.createdAt - a.createdAt;
}

/* ==================================================================
   RENDER
   ================================================================== */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const board = $('#board');
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){
  const items = visibleItems().sort(sortItems);

  // counts
  const open = S.items.filter(i=>!i.done);
  $('#n-today').textContent = open.filter(i=> i.today || i.cat==='fire' || (daysLeft(i.due)!==null && daysLeft(i.due)<=0)).length;
  $('#n-all').textContent   = open.filter(i=>i.cat!=='idea').length;
  $('#n-ideas').textContent = open.filter(i=>i.cat==='idea').length;
  $('#n-done').textContent  = S.items.filter(i=>i.done).length;
  $('#chip-open').textContent = `${open.filter(i=>i.cat!=='idea').length} مفتوحة`;
  $('#chip-streak').innerHTML = `🔥 <b>${S.streak.count}</b> يوم`;

  // progress
  const dToday = S.items.filter(i=>i.done && i.doneAt && keyFrom(i.doneAt)===todayKey()).length;
  const planned = open.filter(i=>i.today).length;
  const total = dToday + planned;
  const pct = total ? Math.round(dToday/total*100) : 0;
  $('#pbar').style.width = pct + '%';
  $('#ptxt').textContent = total
    ? `خلّصتِ ${dToday} من ${total} اليوم — ${pct}%${pct===100?' 🎉 كل الاحترام':''}`
    : (S.items.length ? 'اختاري «خطة اليوم» وحددي ٣ أشياء بس' : 'ابدئي بكتابة أول شي على بالك ✨');

  // empty page
  if(!items.length){
    board.innerHTML = `<div class="empty-page" style="grid-column:1/-1">
      <h3>${emptyTitle()}</h3><p>${emptyBody()}</p></div>`;
    return;
  }

  // group into columns
  const groups = {};
  for(const it of items){ (groups[it.cat] ||= []).push(it); }
  board.innerHTML = ORDER
    .filter(c => groups[c] && groups[c].length)
    .map(c => col(c, groups[c])).join('');
}

function emptyTitle(){
  if(query) return 'ما لقيت شي بهالكلمة';
  return {today:'يومك صافي 🌤️', all:'ما عندك شي مفتوح', ideas:'ما فيه أفكار محفوظة', done:'ما خلّصتِ شي بعد'}[view];
}
function emptyBody(){
  if(query) return 'جرّبي كلمة ثانية، أو امسحي البحث.';
  return {
    today:'ما فيه شي عاجل اليوم. تقدرين تفتحين «كل شي» وتسحبين مهمة لخطة اليوم.',
    all:'اكتبي أي شي فوق — حتى لو نص جملة. أنا برتّبه.',
    ideas:'أي شي يبدأ بـ «فكرة» أو ينتهي بعلامة استفهام بينحفظ هنا بدل ما يضيع.',
    done:'أول ما تخلّصين شي بيظهر هنا. حتى الشي الصغير يحسب.'
  }[view];
}

function col(cat, list){
  const c = CATS[cat];
  return `<section class="col" data-cat="${cat}">
    <div class="col-head">
      <span class="col-dot"></span>
      <div><div class="col-title">${c.e} ${c.t}</div><span class="col-sub">${c.s}</span></div>
      <span class="col-count">${list.length}</span>
    </div>
    <div class="col-body">${list.map(card).join('')}</div>
  </section>`;
}

function card(it){
  const dl = daysLeft(it.due);
  const dueCls = dl===null ? '' : (dl<0 ? ' late' : (dl<=1 ? ' soon' : ''));
  const doneSteps = it.steps.filter(s=>s.d).length;
  const meta = [
    it.due ? `<span class="tag due${dueCls}">📅 ${esc(dueLabel(it.due))}</span>` : '',
    it.steps.length ? `<span class="tag steps">☑︎ ${doneSteps}/${it.steps.length}</span>` : '',
    ...it.tags.map(t=>`<span class="tag">#${esc(t)}</span>`)
  ].join('');

  const steps = it.steps.length ? `<div class="steps">${
    it.steps.map((s,i)=>`<button class="step${s.d?' done':''}" data-step="${it.id}:${i}">
      <span class="step-box">✓</span><span>${esc(s.t)}</span></button>`).join('')
  }</div>` : '';

  return `<article class="card${it.done?' done':''}${it.today?' is-today':''}" data-id="${it.id}">
    <button class="check" data-act="done" aria-label="تمّت">✓</button>
    <div class="card-main">
      <div class="card-text" data-act="edit" role="button" tabindex="0">${esc(it.text)}</div>
      <div class="card-meta">${meta}</div>
      ${steps}
    </div>
    <div class="card-actions">
      <button class="mini${it.today?' on':''}" data-act="today" title="لخطة اليوم">🎯</button>
      <button class="mini" data-act="step" title="قسّميها لخطوات">➕</button>
      <button class="mini" data-act="move" title="غيّري التصنيف">↔︎</button>
      <button class="mini" data-act="del" title="حذف">🗑</button>
    </div>
  </article>`;
}

/* ==================================================================
   BOARD EVENTS
   ================================================================== */
board.addEventListener('click', e => {
  const stepBtn = e.target.closest('[data-step]');
  if(stepBtn){
    const [id, i] = stepBtn.dataset.step.split(':');
    const it = byId(id); if(!it) return;
    it.steps[+i].d = !it.steps[+i].d;
    if(it.steps.length && it.steps.every(s=>s.d) && !it.done){
      toast('كل الخطوات خلصت — أقفلها؟', ()=>toggleDone(id), 'أقفليها');
    }
    save(); render(); return;
  }

  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const id = btn.closest('.card').dataset.id;
  const it = byId(id); if(!it) return;

  switch(btn.dataset.act){
    case 'done':  toggleDone(id); break;
    case 'today': it.today = !it.today; save(); render(); break;
    case 'move':  it.cat = ORDER[(ORDER.indexOf(it.cat)+1) % ORDER.length];
                  save(); render(); toast(`${CATS[it.cat].e} ${CATS[it.cat].t}`); break;
    case 'del':   removeItem(id); break;
    case 'step':  askStep(id, btn); break;
    case 'edit':  editText(id, btn); break;
  }
});
board.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.dataset.act === 'edit'){ e.preventDefault(); e.target.click(); }
});

function removeItem(id){
  const i = S.items.findIndex(x=>x.id===id); if(i<0) return;
  const [gone] = S.items.splice(i,1);
  save(); render();
  toast('انحذفت', ()=>{ S.items.splice(i,0,gone); save(); render(); }, 'تراجع');
}

function editText(id, el){
  const it = byId(id); if(!it || el.tagName==='TEXTAREA') return;
  const ta = document.createElement('textarea');
  ta.className = 'step-input'; ta.value = it.text; ta.rows = 2;
  el.replaceWith(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  const commit = () => {
    const v = ta.value.trim();
    if(v && v !== it.text) it.text = v;
    save(); render();
  };
  ta.addEventListener('blur', commit, {once:true});
  ta.addEventListener('keydown', ev => {
    if(ev.key==='Enter' && !ev.shiftKey){ ev.preventDefault(); ta.blur(); }
    if(ev.key==='Escape'){ ta.removeEventListener('blur', commit); render(); }
  });
}

function askStep(id, btn){
  const it = byId(id); if(!it) return;
  const holder = btn.closest('.card').querySelector('.card-main');
  if(holder.querySelector('.step-input')) return;
  const inp = document.createElement('input');
  inp.className = 'step-input';
  inp.placeholder = 'أصغر خطوة ممكنة… (Enter)';
  holder.appendChild(inp); inp.focus();

  let closed = false;                       // يمنع إعادة الرسم مرتين
  const close = again => {
    if(closed) return; closed = true;
    render();
    if(again) askStepAgain(id);             // تكملين الخطوة اللي بعدها بدون ما توقفين
  };
  inp.addEventListener('keydown', ev => {
    if(ev.key === 'Enter'){
      const v = inp.value.trim();
      if(v){ it.steps.push({t:v, d:false}); save(); }
      close(!!v);
    }
    if(ev.key === 'Escape') close(false);
  });
  inp.addEventListener('blur', ()=> setTimeout(()=>close(false), 120));
}
function askStepAgain(id){
  const b = board.querySelector(`.card[data-id="${id}"] [data-act="step"]`);
  if(b) askStep(id, b);
}

/* ==================================================================
   CAPTURE
   ================================================================== */
const input = $('#capture-input');

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 220) + 'px';
  const v = input.value.trim();
  const prev = $('#preview'), def = $('#hint-default');
  if(!v){ prev.innerHTML=''; def.style.display=''; return; }
  const p = parse(v.split('\n')[0]);
  const c = CATS[classify(p)];
  prev.innerHTML = `<span>بتنحفظ في:</span> <b>${c.e} ${c.t}</b>`
    + (p.due ? ` <span class="tag due">📅 ${esc(dueLabel(p.due))}</span>` : '')
    + p.tags.map(t=>` <span class="tag">#${esc(t)}</span>`).join('');
  def.style.display = 'none';
});

input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); }
});
$('#btn-add').addEventListener('click', submit);

function submit(){
  const raw = input.value;
  if(!raw.trim()) return;
  const lines = raw.split('\n').map(l=>l.replace(/^\s*[-–—•*\d]+[.)]?\s*/,'').trim()).filter(Boolean);
  let n = 0, last = null;
  for(const l of lines){ if(addItem(l)){ n++; last = S.items[0]; } }
  input.value = ''; input.style.height = 'auto';
  $('#preview').innerHTML = ''; $('#hint-default').style.display = '';
  save(); render();
  if(n === 1 && last) toast(`انحفظت في ${CATS[last.cat].e} ${CATS[last.cat].t}`);
  else if(n > 1) toast(`انحفظت ${n} أشياء ورتبتها لك`);
}

/* ==================================================================
   TABS / SEARCH
   ================================================================== */
$$('.tab').forEach(t => t.addEventListener('click', () => {
  view = t.dataset.view;
  $$('.tab').forEach(x => x.setAttribute('aria-selected', String(x === t)));
  render();
}));
$('#search').addEventListener('input', e => { query = e.target.value.trim(); render(); });

/* ==================================================================
   PLAN / CLEANUP
   ================================================================== */
$('#btn-plan').addEventListener('click', () => {
  const open = S.items.filter(i=>!i.done && i.cat!=='idea');
  if(!open.length) return toast('ما فيه مهام — اكتبي شي أول');
  const already = open.filter(i=>i.today).length;
  if(already >= 3) return toast('خطتك جاهزة — ٣ أشياء تكفي اليوم 🎯');
  const pick = open
    .filter(i=>!i.today)
    .sort((a,b)=>{
      const w = {fire:0, star:1, bolt:2, sleep:3};
      const da = daysLeft(a.due) ?? 99, db = daysLeft(b.due) ?? 99;
      return (w[a.cat]-w[b.cat]) || (da-db);
    })
    .slice(0, 3 - already);
  pick.forEach(i => i.today = true);
  view = 'today';
  $$('.tab').forEach(x => x.setAttribute('aria-selected', String(x.dataset.view === 'today')));
  save(); render();
  toast(`اخترت لك ${pick.length} — لا تزيدين عنها اليوم`);
});

$('#btn-clear').addEventListener('click', () => {
  const gone = S.items.filter(i=>i.done);
  if(!gone.length) return toast('ما فيه شي منجز');
  const keep = S.items.filter(i=>!i.done);
  S.items = keep; save(); render();
  toast(`انحذفت ${gone.length}`, ()=>{ S.items = S.items.concat(gone); save(); render(); }, 'تراجع');
});

/* ==================================================================
   FOCUS MODE
   ================================================================== */
const F = { on:false, id:null, left:0, running:false, tick:null, total:0 };

function focusPool(){
  const open = S.items.filter(i=>!i.done && i.cat!=='idea');
  const t = open.filter(i=>i.today);
  return t.length ? t : open.sort((a,b)=> (ORDER.indexOf(a.cat)-ORDER.indexOf(b.cat)));
}

function openFocus(){
  const pool = focusPool();
  if(!pool.length) return toast('ما فيه شي تركزين عليه — اكتبي مهمة أول');
  F.on = true;
  pickFocus(pool[0].id);
  $('#focus').hidden = false;
  document.body.style.overflow = 'hidden';
}
function pickFocus(id){
  F.id = id;
  F.total = S.focusMin * 60;
  F.left = F.total;
  stopTimer();
  paintFocus();
}
function paintFocus(){
  const it = byId(F.id);
  if(!it) return closeFocus();
  $('#focus-task').textContent = it.text;
  $('#focus-steps').innerHTML = it.steps.map((s,i)=>
    `<button class="step${s.d?' done':''}" data-fstep="${i}"><span class="step-box">✓</span><span>${esc(s.t)}</span></button>`
  ).join('');
  paintTimer();
}
function paintTimer(){
  const m = String(Math.floor(F.left/60)).padStart(2,'0');
  const s = String(F.left%60).padStart(2,'0');
  const el = $('#timer');
  el.textContent = `${m}:${s}`;
  el.classList.toggle('paused', !F.running);
  $('#ring').style.width = ((F.total - F.left)/F.total*100) + '%';
  $('#f-toggle').textContent = F.running ? '⏸️ وقّفي' : '▶️ ابدئي';
}
function startTimer(){
  if(F.running) return;
  F.running = true;
  F.tick = setInterval(()=>{
    F.left--;
    if(F.left <= 0){
      stopTimer(); F.left = 0; paintTimer();
      toast('⏰ خلص الوقت — قومي تحركي ٥ دقايق');
      try{ navigator.vibrate?.([200,100,200]); }catch(e){}
      return;
    }
    paintTimer();
  }, 1000);
  paintTimer();
}
function stopTimer(){ clearInterval(F.tick); F.running = false; paintTimer(); }
function closeFocus(){
  F.on = false; stopTimer();
  $('#focus').hidden = true;
  document.body.style.overflow = '';
  render();
}

$('#btn-focus').addEventListener('click', openFocus);
$('#f-toggle').addEventListener('click', ()=> F.running ? stopTimer() : startTimer());
$('#f-exit').addEventListener('click', closeFocus);
$('#f-done').addEventListener('click', ()=>{
  toggleDone(F.id);
  const pool = focusPool();
  if(!pool.length){ closeFocus(); toast('خلصتي كل شي 🎉'); return; }
  pickFocus(pool[0].id);
  toast('👏 وحدة أقل');
});
$('#f-skip').addEventListener('click', ()=>{
  const pool = focusPool();
  if(pool.length < 2) return toast('ما فيه غيرها');
  const i = pool.findIndex(x=>x.id===F.id);
  pickFocus(pool[(i+1) % pool.length].id);
});
$('#focus-steps').addEventListener('click', e=>{
  const b = e.target.closest('[data-fstep]'); if(!b) return;
  const it = byId(F.id); if(!it) return;
  const i = +b.dataset.fstep;
  it.steps[i].d = !it.steps[i].d;
  save(); paintFocus();
});

/* ==================================================================
   DATA MODAL
   ================================================================== */
const modal = $('#modal');
$('#btn-data').addEventListener('click', ()=>{
  $('#data-box').value = JSON.stringify(S, null, 2);
  modal.hidden = false;
});
$('#btn-close').addEventListener('click', ()=> modal.hidden = true);
modal.addEventListener('click', e=>{ if(e.target === modal) modal.hidden = true; });
$('#btn-copy').addEventListener('click', async ()=>{
  const box = $('#data-box');
  try{ await navigator.clipboard.writeText(box.value); toast('انتسخت ✓'); }
  catch(e){ box.select(); toast('اضغطي نسخ من لوحة المفاتيح'); }
});
$('#btn-import').addEventListener('click', ()=>{
  try{
    const p = JSON.parse($('#data-box').value);
    if(!Array.isArray(p.items)) throw 0;
    S = Object.assign(structuredClone(DEFAULT), p);
    save(); render(); applyTheme();
    modal.hidden = true; toast('رجّعت بياناتك ✓');
  }catch(e){ toast('النص مو صحيح — تأكدي من النسخة'); }
});

/* ==================================================================
   THEME
   ================================================================== */
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute('data-theme', S.theme);
  else document.documentElement.removeAttribute('data-theme');
  const dark = S.theme === 'dark' ||
    (!S.theme && matchMedia('(prefers-color-scheme:dark)').matches);
  $('#btn-theme').textContent = dark ? '☀️' : '🌙';
}
$('#btn-theme').addEventListener('click', ()=>{
  const dark = S.theme === 'dark' || (!S.theme && matchMedia('(prefers-color-scheme:dark)').matches);
  S.theme = dark ? 'light' : 'dark';
  save(); applyTheme();
});

/* ==================================================================
   TOASTS
   ================================================================== */
function toast(msg, undo, undoLabel='تراجع'){
  const el = document.createElement('div');
  el.className = 'toast';
  el.append(document.createTextNode(msg));
  if(undo){
    const b = document.createElement('button');
    b.textContent = undoLabel;
    b.onclick = ()=>{ undo(); el.remove(); };
    el.append(b);
  }
  const box = $('#toasts');
  box.append(el);
  while(box.children.length > 3) box.firstElementChild.remove();  // ما نغرق الشاشة
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, undo ? 6000 : 2600);
}

/* ==================================================================
   SHORTCUTS
   ================================================================== */
document.addEventListener('keydown', e=>{
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if(e.key === 'Escape'){
    if(!modal.hidden) modal.hidden = true;
    else if(F.on) closeFocus();
    else if(typing) e.target.blur();
    return;
  }
  if(typing) return;
  if(e.key === 'n' || e.key === 'ن'){ e.preventDefault(); input.focus(); }
  if(e.key === 'f' || e.key === 'ب'){ e.preventDefault(); openFocus(); }
  if(e.key === '/'){ e.preventDefault(); $('#search').focus(); }
  if(F.on && e.key === ' '){ e.preventDefault(); F.running ? stopTimer() : startTimer(); }
});

/* ==================================================================
   BOOT
   ================================================================== */
applyTheme();
render();
window.addEventListener('beforeunload', ()=>{ clearTimeout(saveTimer); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} });

})();
</script>
