:root[data-theme="dark"]{
  --paper:#181F24; --card:#212A30; --line:#2E3940;

}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'UI',system-ui,sans-serif;
  direction:rtl;-webkit-font-smoothing:antialiased;padding-bottom:48px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

header{padding:30px 0 18px}
h1{font-size:23px;font-weight:400;letter-spacing:.01em;line-height:1.35;text-wrap:balance}

.sub{margin-top:8px;color:var(--soft);font-size:14px;line-height:1.7}

.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 0 13px;margin-bottom:18px}
.bar .wrap{display:flex;flex-direction:column;gap:11px}
.ctl{display:flex;align-items:center;gap:12px}
.ctl label{font-size:11.5px;letter-spacing:.14em;color:var(--faint);flex:0 0 46px}
input[type=range]{flex:1;accent-color:var(--accent);height:22px}
.val{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums;flex:0 0 42px;text-align:left}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:var(--card);color:var(--soft);
  border-radius:999px;padding:6px 13px;font:400 12px/1 'UI',sans-serif;cursor:pointer;
  transition:border-color .18s,color .18s,background .18s}
.seg[aria-pressed="true"]{border-color:var(--accent-soft);color:var(--ink);background:transparent}
.seg:focus-visible,.spec:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}

.picked{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--soft)}
.picked b{color:var(--accent);font-weight:700}
.picked span{color:var(--faint);font-size:11.5px}

.list{display:flex;flex-direction:column;gap:10px}
.spec{display:block;width:100%;text-align:right;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px 18px;box-shadow:var(--shadow);
  transition:border-color .2s, box-shadow .2s}
.spec[aria-current="true"]{border-color:var(--accent-soft);
  box-shadow:var(--shadow), inset 3px 0 0 var(--accent-soft)}
.meta{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.nm{font-size:12.5px;color:var(--ink);font-weight:700;letter-spacing:.02em}
.note{font-size:11.5px;color:var(--faint)}
.line{display:flex;align-items:baseline;justify-content:center;color:var(--accent);
  line-height:1.5;overflow-x:auto;scrollbar-width:none}
.line::-webkit-scrollbar{display:none}
.line>span{flex:0 0 auto;text-align:center;min-width:1.9em}
.line i{font-style:normal;font-family:'UI',sans-serif;font-weight:400;color:var(--accent-soft);
  font-size:.62em;margin:0 .16em;transform:scaleY(1.45)}

body.ground-wash .spec{background:linear-gradient(160deg,#DFE8EC,#F3EEE4)}
body.ground-wash .nm{color:#25323A} body.ground-wash .note{color:#7C8B93}
body.ground-wash .line{color:#3E5866}
body.ground-plain .spec{background:var(--card)}

footer{margin-top:26px;color:var(--faint);font-size:12px;line-height:1.8;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(function(){
  var sz=document.getElementById('sz'), szv=document.getElementById('szv'),
      list=document.querySelectorAll('.spec'), pick=document.getElementById('pick'),
      picknote=document.getElementById('picknote'), body=document.body;
  var AR='٠١٢٣٤٥٦٧٨٩';
  function ar(n){return String(n).replace(/\d/g,function(d){return AR[+d];});}
  function setSize(v){
    szv.textContent=ar(v)+'px';
    list.forEach(function(el){el.querySelector('.line').style.fontSize=v+'px';});
  }
  sz.addEventListener('input',function(){setSize(this.value);});
  setSize(sz.value);

  body.classList.add('ground-plain');
  function ground(which){
    body.classList.toggle('ground-wash', which==='wash');
    body.classList.toggle('ground-plain', which!=='wash');
    document.getElementById('g-wash').setAttribute('aria-pressed', which==='wash');
    document.getElementById('g-plain').setAttribute('aria-pressed', which!=='wash');
  }
  document.getElementById('g-wash').addEventListener('click',function(){ground('wash');});
  document.getElementById('g-plain').addEventListener('click',function(){ground('plain');});

  var NO='اأإآدذرزوؤةىءٱ', on=false;
  function stretch(w,n){var o='';for(var i=0;i<w.length;i++){o+=w.charAt(i);
    if(i<w.length-1&&NO.indexOf(w.charAt(i))===-1)o+=new Array(n+1).join('ـ');}return o;}
  document.getElementById('kash').addEventListener('click',function(){
    on=!on; this.setAttribute('aria-pressed',on);
    list.forEach(function(el){var s=el.querySelectorAll('.line>span');
      s[0].textContent=on?stretch('سند',3):'سند';
      s[1].textContent=on?stretch('نورة',3):'نورة';});
  });

  list.forEach(function(el){
    el.addEventListener('click',function(){
      list.forEach(function(o){o.removeAttribute('aria-current');});
      el.setAttribute('aria-current','true');
      pick.textContent=el.dataset.name;
      picknote.textContent='— قوليه لي وأركّبه';
      try{localStorage.setItem('pick',el.dataset.font);}catch(e){}
    });
  });
  try{var p=localStorage.getItem('pick');
    if(p){var el=document.querySelector('.spec[data-font="'+p+'"]');
      if(el){el.setAttribute('aria-current','true');pick.textContent=el.dataset.name;
        picknote.textContent='— قوليه لي وأركّبه';}}}catch(e){}
})();
</script>
