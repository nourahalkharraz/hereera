/* ═══════════════════════════════════════════════════════════════════
   عقد قران — نورة و سند

   الفكرة: الغلاف حقل لون واحد مشقوق في منتصفه، والاسمان مكتوبان
   على الشقّ فيقطعهما. باللمس ينفصل النصفان — فيظهر تحتهما الإعلان
   حيث الاسمان مجتمعان. الانفصال يكشف الاجتماع.

   كل ما يُكتب موجود في كائن DATA بآخر الملف.
   ═══════════════════════════════════════════════════════════════════ */
:root {
  --pine:     #25403A;   /* حقل الغلاف */
  --pine-lit: #38564E;   /* حافة الشقّ */
  --bone:     #EDEAE3;   /* أرضية الإعلان */
  --paper:    #F5F3EE;
  --ink:      #16150F;
  --soft:     #5B574F;
  --line:     #D3CEC4;
  --split: .55s;
  --cut-y: -.12em;   /* يُنزل النصّ حتى يمرّ الشقّ في وسط الحروف لا تحتها */
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  direction: rtl;
  min-height: 100dvh;
  background: var(--bone);
  color: var(--ink);
  font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  font-weight: 300;
  overflow: hidden;
}

/* ═══════════ الغلاف ═══════════ */
#cover { position: fixed; inset: 0; z-index: 10; }
.half {
  position: absolute; left: 0; right: 0; height: 50%;
  background: var(--pine); overflow: hidden;
  transition: transform 1.15s cubic-bezier(.76,0,.16,1);
  will-change: transform;
}
.half.t { top: 0; }
.half.b { bottom: 0; }
.opened .half.t { transform: translateY(-100%); }
.opened .half.b { transform: translateY(100%); }

/* الاسمان مرسومان مرّتين ومحاذيان لنفس الموضع على الشاشة،
   فيبدوان نصّاً واحداً يمرّ فيه الشقّ */
.cut {
  position: absolute; left: 0; right: 0; text-align: center;
  font-family: 'Reem Kufi', system-ui, sans-serif; font-weight: 700;
  font-size: clamp(44px, 21vw, 130px); line-height: 1;
  color: var(--bone); letter-spacing: .01em; white-space: nowrap;
}
.half.t .cut { bottom: 0; transform: translateY(50%)  translateY(var(--cut-y)); }
.half.b .cut { top: 0;    transform: translateY(-50%) translateY(var(--cut-y)); }
.cut i { font-style: normal; opacity: .42; font-size: .5em; margin: 0 .34em;
  vertical-align: .12em; }

/* الفاصلة الوحيدة على الغلاف: شعرة تمتد من الحافة إلى الحافة */
#seam {
  position: fixed; left: 0; right: 0; top: 50%; height: 1px; z-index: 11; pointer-events: none;
  background: rgba(237,234,227,.28); transform-origin: 50% 50%;
  transition: opacity .35s ease;
}
.opened #seam { opacity: 0; }
.revealed #cover { visibility: hidden; }

#hint {
  position: fixed; left: 0; right: 0; z-index: 12; pointer-events: none;
  bottom: calc(30px + env(safe-area-inset-bottom));
  text-align: center; color: var(--bone);
  font-size: 12px; font-weight: 500; letter-spacing: .38em; opacity: .55;
  transition: opacity .3s ease;
}
.opened #hint { opacity: 0; }

/* ═══════════ الإعلان ═══════════ */
#sheet {
  position: fixed; inset: 0; z-index: 1;
  background: transparent;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column; justify-content: flex-start;
  padding: calc(34px + env(safe-area-inset-top)) clamp(26px, 8vw, 96px)
           calc(76px + env(safe-area-inset-bottom));
}

/* علامة هندسية واحدة تنزف خارج الإطار — كل التوتر البصري فيها */
#mark {
  position: fixed; z-index: 0; left: -22%; bottom: -18%;
  width: min(82vw, 520px); height: min(82vw, 520px);
  color: var(--pine); pointer-events: none;
}
#mark svg { width: 100%; height: 100%; display: block; }

.content { position: relative; z-index: 2; width: 100%; max-width: 620px;
  margin-inline-start: auto; margin-block: auto; }
.content > * { clip-path: inset(0 0 100% 0); transform: translateY(18px);
  transition: clip-path .95s cubic-bezier(.22,.9,.3,1), transform .95s cubic-bezier(.22,.9,.3,1); }
.revealed .content > * { clip-path: inset(0 0 0 0); transform: none; }
.revealed .content > *:nth-child(1){transition-delay:.10s}
.revealed .content > *:nth-child(2){transition-delay:.20s}
.revealed .content > *:nth-child(3){transition-delay:.42s}
.revealed .content > *:nth-child(4){transition-delay:.52s}
.revealed .content > *:nth-child(5){transition-delay:.62s}
.revealed .content > *:nth-child(6){transition-delay:.72s}

.label { font-weight: 500; font-size: clamp(11px, 2.7vw, 13px); letter-spacing: .46em;
  color: var(--pine); margin-bottom: clamp(20px, 5vw, 30px); }

.names { font-family: 'Reem Kufi', system-ui, sans-serif; font-weight: 700;
  font-size: clamp(52px, 19vw, 128px); line-height: .96; letter-spacing: -.015em;
  color: var(--ink); }
.names > span { display: block; }
.names .two { margin-top: .06em; }
.names em { font-style: normal; color: var(--pine); font-size: .42em;
  vertical-align: .34em; margin-left: .22em; opacity: .8; }

.rule { height: 1px; background: var(--line); margin: clamp(26px, 7vw, 42px) 0 clamp(20px, 5vw, 28px); }

.full { font-size: clamp(14px, 3.6vw, 17px); line-height: 2.1; color: var(--soft); }
.date { font-weight: 500; font-size: clamp(14px, 3.6vw, 17px); letter-spacing: .3em;
  color: var(--ink); margin-top: clamp(18px, 4.5vw, 26px); }
.dua  { font-size: clamp(13px, 3.4vw, 16px); line-height: 2.1; color: var(--soft);
  margin-top: clamp(22px, 5.5vw, 32px); max-width: 34ch; }

/* ═══════════ الإعادة ═══════════ */
#replay {
  position: fixed; z-index: 20; inset-inline-end: clamp(20px, 6vw, 40px);
  bottom: calc(20px + env(safe-area-inset-bottom));
  min-height: 44px; min-width: 44px; padding: 0 18px;
  display: inline-flex; align-items: center; gap: 8px;
  background: transparent; color: var(--soft);
  border: 1px solid var(--line); border-radius: 2px;
  font-family: inherit; font-size: 12px; font-weight: 500; letter-spacing: .2em;
  cursor: pointer; opacity: 0; pointer-events: none;
  transition: opacity .5s ease 1.2s, color .2s ease, border-color .2s ease;
}
.revealed #replay { opacity: 1; pointer-events: auto; }
#replay:hover, #replay:focus-visible { color: var(--pine); border-color: var(--pine); }
:focus-visible { outline: 2px solid var(--pine); outline-offset: 3px; }
#cover:focus { outline: none; }
#cover:focus-visible { outline: 2px solid var(--bone); outline-offset: -6px; }

/* الشاشات القصيرة والأفقية */
@media (min-width: 940px) {
  .content { margin-inline: auto; }
  #mark { left: 4%; bottom: -14%; }
}

@media (max-height: 560px) {
  #sheet { padding: 22px clamp(26px, 8vw, 96px) 20px; }
  .names { font-size: clamp(34px, 10.5vh, 56px); }
  .label { margin-bottom: 14px; }
  .rule { margin: 16px 0 13px; }
  .full, .dua { line-height: 1.8; }
  .date { margin-top: 13px; }
  .dua { margin-top: 15px; }
  #mark { display: none; }
  #hint { bottom: 12px; }
}

@media print {
  #cover, #seam, #hint, #replay { display: none !important; }
  #sheet { position: static; overflow: visible; padding: 12mm; }
  .content > * { clip-path: none !important; transform: none !important; }
  body { overflow: visible; background: #fff; }
}

@media (prefers-reduced-motion: reduce) {
  .half, .content > *, #seam, #hint, #replay { transition-duration: .01ms !important; }
}
</style>

<noscript><style>
  #cover, #seam, #hint, #replay { display: none !important; }
  .content > * { clip-path: none !important; transform: none !important; }
</style></noscript>

    <p class="date" id="d-date">١٥ · ٠٣ · ٢٠٢٦</p>
    <p class="dua" id="d-dua">سائلين المولى أن يُتمّم علينا بخير<br>وأن يديم علينا المحبة والوفاق</p>
  </div>
</main>

<!-- الغلاف -->
<div id="cover" role="button" tabindex="0" aria-label="افتح الإعلان">
  <div class="half t"><div class="cut" data-cut></div></div>
  <div class="half b"><div class="cut" data-cut></div></div>
</div>
<div id="seam" aria-hidden="true"></div>
<div id="hint">للفتح · انقر</div>

<button id="replay">إعادة</button>

<script>
/* ═══════════ عدّلي المحتوى من هنا ═══════════ */
var DATA = {
  label: "عقد قران",
  one:   "نورة",
  two:   "سند",
  full:  "نورة عبدالوهاب الخرّاز<br>سند عبدالله الفايز",
  date:  "١٥ · ٠٣ · ٢٠٢٦",
  dua:   "سائلين المولى أن يُتمّم علينا بخير<br>وأن يديم علينا المحبة والوفاق"
};
/* ═══════════════════════════════════════════ */

var $ = function (s) { return document.querySelector(s); };
document.documentElement.lang = "ar";
document.documentElement.dir  = "rtl";

$("#d-label").textContent = DATA.label;
$("#d-one").textContent   = DATA.one;
$("#d-two").textContent   = DATA.two;
$("#d-full").innerHTML    = DATA.full;
$("#d-date").textContent  = DATA.date;
$("#d-dua").innerHTML     = DATA.dua;
document.title = DATA.one + " و " + DATA.two;

/* النسختان على جانبَي الشقّ لا بد أن تتطابقا حرفاً بحرف */
[].forEach.call(document.querySelectorAll("[data-cut]"), function (el) {
  el.innerHTML = DATA.one + '<i>و</i>' + DATA.two;
});

var opened = false, timer = null;
function open() {
  if (!opened) {
    opened = true;
    document.body.classList.add("opened");
    timer = setTimeout(finish, 550);            /* المحتوى يبدأ والنصفان ما زالا يتباعدان */
  } else if (!document.body.classList.contains("revealed")) {
    clearTimeout(timer); finish();              /* نقرة أثناء الحركة تقفز للنهاية */
  }
}
function finish() {
  document.body.classList.add("revealed");
  var c = $("#cover");
  c.setAttribute("aria-hidden", "true"); c.setAttribute("tabindex", "-1");
  $("#sheet").removeAttribute("aria-hidden");
  $("#sheet").focus({ preventScroll: true });
}
function reset() {
  clearTimeout(timer); opened = false;
  document.body.classList.remove("opened", "revealed");
  var c = $("#cover");
  c.removeAttribute("aria-hidden"); c.setAttribute("tabindex", "0");
  $("#sheet").setAttribute("aria-hidden", "true");
  c.focus({ preventScroll: true });
}
$("#sheet").setAttribute("aria-hidden", "true");
$("#cover").addEventListener("click", open);
$("#cover").addEventListener("keydown", function (e) {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
});
$("#replay").addEventListener("click", function (e) { e.stopPropagation(); reset(); });
</script>
