<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<meta name="referrer" content="no-referrer">
<title>MT5 Panel</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📈</text></svg>">
</head>
<body dir="rtl">

<div id="login" class="hidden">
  <form id="login-card" autocomplete="off">
    <div class="login-logo">MT5 Panel</div>
    <p class="note" id="login-hint"></p>
    <input type="password" id="login-pass" autocomplete="current-password">
    <button type="submit" class="big-btn buy" id="login-go" style="width:100%"></button>
    <p class="warn" id="login-err"></p>
  </form>
</div>

<div id="phone">

  <header id="topbar">
    <span class="dot" id="conn-dot"></span>
    <div>
      <div class="title" id="hdr-title">MT5 Panel</div>
      <div class="sub" id="hdr-sub">…</div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="btn-lang" title="AR / EN">EN</button>
    <button class="icon-btn" id="btn-refresh" title="refresh">⟳</button>
  </header>

  <main id="views">

    <!-- ------------------------------------------------ quotes -->
    <section class="view active" id="view-quotes">
      <div class="chips" id="quotes-actions"></div>
      <div class="card" id="quotes-list"></div>
    </section>

    <!-- ------------------------------------------------ chart -->
    <section class="view" id="view-chart">
      <div id="chart-head">
        <span class="sym" id="chart-symbol">—</span>
        <span class="last numeric" id="chart-last"></span>
      </div>
      <div class="chips" id="tf-chips"></div>
      <div id="chart-wrap"><canvas id="chart"></canvas></div>
      <div class="chips" id="chart-actions"></div>
    </section>

    <!-- ------------------------------------------------ trade -->
    <section class="view" id="view-trade">
      <div class="card" id="account-card"></div>
      <div class="section-title" id="t-positions">Positions</div>
      <div class="card" id="positions-list"></div>
      <div class="section-title" id="t-orders">Pending orders</div>
      <div class="card" id="orders-list"></div>
      <div style="padding:4px 12px 8px">
        <button class="btn-line danger" id="btn-close-all"></button>
      </div>
    </section>

    <!-- ------------------------------------------------ history -->
    <section class="view" id="view-history">
      <div class="chips" id="history-chips"></div>
      <div class="card" id="history-totals"></div>
      <div class="card" id="history-list"></div>
    </section>

    <!-- ------------------------------------------------ bot -->
    <section class="view" id="view-bot">
      <div class="card" id="bot-main"></div>
      <div id="bot-halt"></div>
      <div class="section-title" id="t-bot-scan">Market read</div>
      <div class="card" id="bot-scan"></div>
      <div class="section-title" id="t-bot-paper">Paper trades</div>
      <div class="card" id="bot-paper"></div>
      <div class="section-title" id="t-bot-settings">Settings</div>
      <div class="card" id="bot-settings"></div>
      <div class="section-title" id="t-bt">Backtest</div>
      <div class="card" id="bt-panel"></div>
      <div class="section-title" id="t-bot-log">Log</div>
      <div class="card" id="bot-log"></div>
      <div class="card" style="padding:14px 16px">
        <p class="note" id="bot-note"></p>
      </div>
    </section>

    <!-- ------------------------------------------------ settings -->
    <section class="view" id="view-settings">
      <div class="section-title" id="t-appearance">Appearance</div>
      <div class="card" id="settings-appearance"></div>
      <div class="section-title" id="t-connection">Connection</div>
      <div class="card" id="settings-connection"></div>
      <div class="section-title" id="t-about">About</div>
      <div class="card" style="padding:14px 16px">
        <p class="note" id="about-text"></p>
      </div>
    </section>

  </main>

  <button id="fab" title="new order">+</button>

  <nav id="tabbar">
    <button class="tab active" data-view="quotes">
      <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 5-7 4 5"/><path d="M3 21h18"/></svg>
      <span data-i18n="tab_quotes">Quotes</span>
    </button>
    <button class="tab" data-view="chart">
      <svg viewBox="0 0 24 24"><path d="M4 4v16h16"/><rect x="7" y="9" width="3" height="8"/><rect x="14" y="6" width="3" height="11"/></svg>
      <span data-i18n="tab_chart">Chart</span>
    </button>
    <button class="tab" data-view="trade">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h7"/><circle cx="18" cy="16" r="3"/></svg>
      <span data-i18n="tab_trade">Trade</span>
    </button>
    <button class="tab" data-view="bot">
      <svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4"/><circle cx="9" cy="13" r="1.2"/><circle cx="15" cy="13" r="1.2"/></svg>
      <span data-i18n="tab_bot">Auto</span>
    </button>
    <button class="tab" data-view="history">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span data-i18n="tab_history">History</span>
    </button>
    <button class="tab" data-view="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
      <span data-i18n="tab_settings">Settings</span>
    </button>
  </nav>

  <div id="scrim"></div>
  <div id="sheet">
    <div class="sheet-head">
      <h3 id="sheet-title"></h3>
      <button class="icon-btn" id="sheet-close">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div id="toast"></div>
</div>

<script>window.PANEL_KEY = "__PANEL_KEY__";</script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
